<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Okvia</title>
<style>
  html, body { margin: 0; height: 100%; background: #131722; color: #e6e9ef;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* 40px drag band so the frameless window stays movable (matches the web title bar). */
  .bar { position: fixed; inset: 0 0 auto 0; height: 40px; -webkit-app-region: drag; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .spin { width: 22px; height: 22px; border: 2px solid #2b3240; border-top-color: #5fb3b3; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: 17px; font-weight: 600; color: #fff; }
  p { margin: 0; color: #8b93a3; max-width: 340px; }
  button { margin-top: 6px; background: #1f2633; color: #fff; border: 1px solid #333c4d; border-radius: 8px;
    padding: 7px 16px; font: inherit; cursor: pointer; -webkit-app-region: no-drag; }
  button:hover { background: #283042; }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <div class="spin"></div>
  <h1>Waiting for a connection</h1>
  <p>Okvia couldn't reach the server. It will reconnect automatically as soon as your network is back.</p>
  <button id="retry" type="button">Retry now</button>
</main>
<script>
  // The main process passes the page to return to; it retries on its own timer too.
  const target = new URLSearchParams(location.search).get("target") || "";
  const go = () => { if (/^https:\/\//.test(target)) location.href = target; };
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
</script>
</body>
</html>
